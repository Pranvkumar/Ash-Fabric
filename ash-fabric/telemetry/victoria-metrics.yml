# VictoriaMetrics scrape configuration
# This is used if running vmagent as a sidecar
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "mock-exporter"
    static_configs:
      - targets: ["mock-exporter:9100"]
    scrape_interval: 30s

  - job_name: "orchestrator"
    static_configs:
      - targets: ["orchestrator:8080"]
    metrics_path: /metrics
    scrape_interval: 15s
