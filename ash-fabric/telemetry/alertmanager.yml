global:
  resolve_timeout: 5m

route:
  receiver: ash-webhook
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: ash-webhook
    webhook_configs:
      - url: "http://orchestrator:8080/api/v1/alerts"
        send_resolved: true
        max_alerts: 10
